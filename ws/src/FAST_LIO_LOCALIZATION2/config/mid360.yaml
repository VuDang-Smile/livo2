/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 3
        max_iteration: 3
        filter_size_surf: 0.5
        filter_size_map: 0.5
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        common:
            lid_topic:  "/livox/lidar"
            imu_topic:  "/livox/imu"
            time_sync_en: false         # ONLY turn on when external time synchronization is really not possible
            time_offset_lidar_to_imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).
                                        # This param will take effect no matter what time_sync_en is. So if the time offset is not known exactly, please set as 0.0
            global_loc_convergence_thresh: 10.0  # meters; TĂNG LÊN 10.0 để cho phép xy distance lớn hơn (log shows 6.40 > 6.00)
            global_loc_fitness_thresh: 3.5      # ICP score threshold; TĂNG LÊN 3.5 để chấp nhận fitness ~2.7-2.8 ngay từ đầu (không cần đợi adaptive)
            global_loc_height_thresh: -1.0      # meters; <=0 disables vertical gating so lower mounts still converge
            global_loc_force_map_height: false  # allow using current odom height; avoid forcing map Z if map might be off
            global_loc_auto_height_align: false  # still align if map tile provides height
            global_loc_z_bias: 0.0              # no manual bias; keep Z as-is to match measured pose (e.g., z≈1.069)

        global_loc:
            # Allow relocalization anywhere in the fastloc map (disable 15 m gate)
            candidate_max_distance: 120.0
            
            # Adaptive fitness threshold for better relocalization on PCD maps from livo2
            fitness_thresh_max: 20.0              # Maximum fitness threshold (TĂNG LÊN 20.0 để cho phép match với PCD maps từ livo2 - fitness 12.566 sẽ được chấp nhận)
            fitness_adaptive_step: 0.5            # Step size for adaptive threshold (tăng lên để adapt nhanh hơn)
            fitness_adaptive_enable: true         # Enable adaptive threshold
            
            # Single-shot thresholds for immediate relocalization
            single_shot_fitness_thresh: 3.0      # Accept immediately if fitness <= this (TĂNG LÊN 3.0 để chấp nhận fitness ~2.7-2.8 ngay lập tức)
            gicp_single_shot_thresh: 2.0         # Stricter threshold for GICP-only fallback (TĂNG LÊN 2.0 để chấp nhận GICP tốt hơn)
            
            # Virtual ScanContext for better coverage on tiled maps
            enable_virtual_scancontexts: true     # Enable virtual ScanContext generation
            virtual_tile_spacing: 10.0            # Spacing between virtual tiles (meters)
            virtual_tile_radius: 15.0             # Radius of virtual tiles (meters)
            virtual_tile_min_points: 400          # Minimum points required for virtual tile
            virtual_tile_max_tiles: 200           # Maximum number of virtual tiles
            
            # Freeze odometry until relocalized
            # TẮT freeze để hệ thống có thể di chuyển ngay khi start (theo FAST-LOCALIZATION gốc - không cần manual initial pose)
            freeze_odom_until_locked: false       # TẮT freeze để hệ thống có thể di chuyển ngay, global localization sẽ chạy song song
            freeze_on_no_points: true             # Freeze odom when no points available
            freeze_on_no_points_tolerance: 0.25    # Tolerance for no points (seconds)
            unfreeze_after_relocalize: true       # Unfreeze after successful relocalization
            
            # Auto-trigger relocalization when drift detected
            # GIẢM threshold để relocalize sớm hơn và giảm drift (theo FAST-LOCALIZATION gốc)
            auto_trigger_enable: true              # Enable auto-trigger relocalization
            auto_trigger_xy_distance: 10.0         # Trigger when XY drift >= this (GIẢM từ 60.0 xuống 10.0 để relocalize sớm hơn)
            auto_trigger_height: 1.5               # Trigger when height drift >= this (GIẢM từ 3.0 xuống 1.5 để relocalize sớm hơn)
            auto_trigger_cooldown: 5.0             # Cooldown between auto-triggers (GIẢM từ 8.0 xuống 5.0 để relocalize nhanh hơn)
            auto_trigger_hysteresis: 2.0          # Hysteresis to prevent oscillation (GIẢM từ 5.0 xuống 2.0 để nhạy hơn)
            
            # GICP/NDT fallback for better relocalization
            enable_ndt_fallback: true              # Enable NDT/GICP fallback when ScanContext fails
            ndt_fallback_radius: 25.0             # Search radius for fallback (meters)
            ndt_fallback_min_points: 200          # Minimum points required for fallback
            ndt_fallback_fitness_thresh: 15.0      # Fitness threshold for fallback acceptance (TĂNG LÊN 15.0 để cho phép match tốt hơn)

        preprocess:
            lidar_type: 1                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR, 4 for any other pointcloud input
            scan_line:  4
            blind: 0.5
            timestamp_unit: 3
            scan_rate: 10

        mapping:
            acc_cov: 0.5            # HIGH: reduce IMU weight when device is tilted
            gyr_cov: 0.5            # HIGH: reduce gyro weight when device is tilted
            b_acc_cov: 0.001        # Increased bias uncertainty
            b_gyr_cov: 0.001        # Increased bias uncertainty
            fov_degree:    360.0
            det_range:     100.0
            extrinsic_est_en:  false     # DISABLED: online extrinsic estimation can confuse device tilt with calibration error
            extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
            extrinsic_R: [ 1., 0., 0.,
                            0., 1., 0.,
                            0., 0., 1.]

        publish:
            path_en: true                # true: publish Path
            effect_map_en: false         # true: publish Effects
            map_en: true                 # true: publish Map cloud
            scan_publish_en:  true       # false: close all the point cloud output
            dense_publish_en: false      # false: low down the points number in a global-frame point clouds scan.
            scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame

        pcd_save:
            pcd_save_en: true
            interval: -1                 # how many LiDAR frames saved in each pcd file; 
                                        # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.